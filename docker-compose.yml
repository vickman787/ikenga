services:
  postgres:
    image: postgres:16-alpine
    container_name: ikenga-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ikenga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikenga}
      POSTGRES_DB: ${POSTGRES_DB:-ikenga}
    ports:
      - "5433:5432"
    volumes:
      - ikenga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikenga}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ikenga-postgres-data:
